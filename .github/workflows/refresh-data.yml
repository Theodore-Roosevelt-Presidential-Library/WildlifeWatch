name: Refresh wildlife data

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~5–6 a.m. in Medora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull iNaturalist observations
        run: node scripts/build-inat.mjs
      - name: Commit if changed
        run: |
          git config user.name "wildlife-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inat.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh wildlife data $(date -u +%Y-%m-%d)"
            git push
          fi
